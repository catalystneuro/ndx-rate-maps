groups:
- neurodata_type_def: RateMapTable
  neurodata_type_inc: DynamicTable
  doc: A table storing rate maps (spatial firing rate maps or tuning curves). Each
    row corresponds to a unit. All rate maps in a table share the same binning. For
    multiple conditions, create separate table instances.
  attributes:
  - name: unit_of_measurement
    dtype: text
    value: Hz
    doc: Unit for rate map values (always Hz)
  - name: dim0_label
    dtype: text
    doc: Label for the first dimension (e.g., 'x_position', 'head_direction')
  - name: dim0_unit
    dtype: text
    doc: Unit of measurement for the first dimension (e.g., 'cm', 'radians')
  - name: dim1_label
    dtype: text
    doc: Label for the second dimension (e.g., 'y_position'). Only present for 2D
      rate maps.
    required: false
  - name: dim1_unit
    dtype: text
    doc: Unit of measurement for the second dimension (e.g., 'cm'). Only present for
      2D rate maps.
    required: false
  - name: smoothing_kernel
    dtype: text
    doc: Type of smoothing kernel applied (e.g., 'gaussian', 'box')
    required: false
  - name: smoothing_kernel_width
    dtype: float64
    doc: Width/sigma of the smoothing kernel, in the same units as bin_edges
    required: false
  datasets:
  - name: bin_edges_dim0
    dtype: float64
    dims:
    - num_bins_dim0_plus_1
    shape:
    - null
    doc: Bin edges along the first dimension (length = num_bins + 1)
  - name: bin_edges_dim1
    dtype: float64
    dims:
    - num_bins_dim1_plus_1
    shape:
    - null
    doc: Bin edges along the second dimension (length = num_bins + 1). Only present
      for 2D rate maps.
    quantity: '?'
  - name: units
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the units in the Units table that correspond to each row
  - name: rate_map
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Rate map values in Hz. Shape per row is (num_bins,) for 1D maps or (num_bins_x,
      num_bins_y) for 2D maps.
  - name: occupancy_map
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Time spent per bin in seconds. Same shape as rate_map.
    quantity: '?'
  - name: spike_count_map
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Number of spikes per bin. Same shape as rate_map.
    quantity: '?'
  links:
  - name: source_timeseries
    target_type: TimeSeries
    doc: Source behavioral timeseries (e.g., position data)
    quantity: '?'
  - name: time_support
    target_type: TimeIntervals
    doc: Time intervals over which these rate maps were computed (e.g., trials, epochs,
      or custom intervals)
    quantity: '?'
